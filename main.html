    <div id="table-container-modal-sakaz_narad"></div>

    <script type="module" src="/src/ts/main.ts"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>

    <script type="module">
        import { setupSearchWithTableFilter } from "/src/ts/roboha/tablucya/pochuk.ts";
        import { loadActsTable } from "/src/ts/roboha/tablucya/tablucya.ts";

        $(function () {
            let currentFilterType = 'open'; // Зберігаємо поточний тип фільтрації ('open' або 'date_range')
            let currentDateFrom = null;
            let currentDateTo = null;

            $('#dateRangePicker').daterangepicker(
                {
                    locale: {
                        format: 'DD.MM.YYYY',
                        separator: ' - ',
                        applyLabel: 'Прийняти',
                        cancelLabel: 'Відмінити',
                        fromLabel: 'Від',
                        toLabel: 'До',
                        weekLabel: 'Тиж',
                        daysOfWeek: ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'],
                        monthNames: [
                            'Січень', 'Лютий', 'Березень', 'Квітень', 'Травень', 'Червень',
                            'Липень', 'Серпень', 'Вересень', 'Жовтень', 'Листопад', 'Грудень'
                        ],
                        firstDay: 1
                    },
                    opens: 'center',
                    alwaysShowCalendars: true,
                    autoUpdateInput: false, // ⛔ Вимикаємо автооновлення, щоб керувати значенням вручну
                    startDate: moment().startOf('year'),
                    endDate: moment(),
                    ranges: {
                        'Відкриті': [moment().startOf('year'), moment()],
                        'Сьогодні': [moment(), moment()],
                        //'Вчора': [moment().subtract(1, 'days'), moment().subtract(1, 'days')],
                        'Останні 7 днів': [moment().subtract(6, 'days'), moment()],
                        'Останні 30 днів': [moment().subtract(29, 'days'), moment()],
                        'Поточний місяць': [moment().startOf('month'), moment().endOf('month')],
                        'Минулий місяць': [
                            moment().subtract(1, 'month').startOf('month'),
                            moment().subtract(1, 'month').endOf('month')
                        ],
                        'Від початку': [moment('02.01.2025', 'DD.MM.YYYY'), moment()]
                    },
                    showCustomRangeLabel: false
                },
                function (start, end, label) {
                    if (label === 'Відкриті') {
                        $('#dateRangePicker').val('Відкриті');
                        $('#dateRangePicker').data('daterangepicker').element.removeClass('active-range');

                        currentFilterType = 'open';
                        currentDateFrom = null;
                        currentDateTo = null;
                        loadActsTable(null, null, 'open');

                        this.setStartDate(moment().startOf('year'));
                        this.setEndDate(moment());

                    } else {
                        const formatted = `${start.format('DD.MM.YYYY')} - ${end.format('DD.MM.YYYY')}`;
                        $('#dateRangePicker').val(formatted);
                        $('#dateRangePicker').data('daterangepicker').element.addClass('active-range');

                        currentDateFrom = start.format("YYYY-MM-DD 00:00:00");
                        currentDateTo = end.format("YYYY-MM-DD 23:59:59");

                        currentFilterType = 'date_range';
                        loadActsTable(currentDateFrom, currentDateTo);
                    }
                }
            );

            // Ініціалізація при першому завантаженні сторінки:
            $('#dateRangePicker').val('Відкриті');
            currentFilterType = 'open';
            loadActsTable(null, null, 'open');

            const picker = $('#dateRangePicker').data('daterangepicker');
            if (picker) {
                picker.setStartDate(moment().startOf('year'));
                picker.setEndDate(moment());
            }

            // Ініціалізація пошуку з використанням нового модуля
            const searchHandler = setupSearchWithTableFilter(
                loadActsTable,
                () => currentFilterType,
                () => ({ dateFrom: currentDateFrom, dateTo: currentDateTo })
            );

            // Додаткові методи для роботи з пошуком (опціонально)
            window.searchHandler = searchHandler; // Для доступу з інших частин коду
        });
    </script>

</body>
<p class="alim">Алім 2025 / 1.0.0</p>
